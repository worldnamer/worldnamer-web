# Version updates open pull requests for new releases whether or not a
# security advisory exists. Advisories can reach GitHub's database late, so
# alerts and security updates alone can miss a vulnerable dependency.
# Minor and patch bumps arrive as one grouped pull request; majors come
# separately.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Honeycomb's wrapper pins the OpenTelemetry stack and requires
    # auto-instrumentations-web ^0.65, and 0.69 fails the build; lift when
    # Honeycomb ships support (register item worldnamer_com/65; see the
    # version trap in LORE.md).
    ignore:
      - dependency-name: "@opentelemetry/auto-instrumentations-web"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
