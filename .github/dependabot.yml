# Version updates open pull requests for new releases whether or not a
# security advisory exists. Advisories can reach GitHub's database late, so
# alerts and security updates alone can miss a vulnerable dependency.
# Minor and patch bumps arrive as one grouped pull request; majors come
# separately.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
